<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1240' viewBox='0 0 1200 1240' role='img'><rect width='1200' height='1240' fill='white'/>
<rect x='35' y='40' width='465' height='290' fill='white' stroke='#203747' stroke-width='2'/>
<rect x='35' y='40' width='465' height='55' fill='#E8F4F1' stroke='#203747' stroke-width='2'/>
<text x='267.5' y='78' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#203747'>Student</text>
<text x='55' y='175' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>id: PK</text>
<text x='55' y='206.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>email: case-insensitive unique</text>
<text x='55' y='237.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>full_name, phone, location</text>
<text x='55' y='268.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>created_at, updated_at</text>
<rect x='700' y='40' width='465' height='290' fill='white' stroke='#203747' stroke-width='2'/>
<rect x='700' y='40' width='465' height='55' fill='#E8F4F1' stroke='#203747' stroke-width='2'/>
<text x='932.5' y='78' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#203747'>Course</text>
<text x='720' y='175' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>id: PK</text>
<text x='720' y='206.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>name, level, location</text>
<text x='720' y='237.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>price: Decimal (NGN)</text>
<text x='720' y='268.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>intakes: JSON; active: Boolean</text>
<rect x='350' y='435' width='510' height='395' fill='white' stroke='#203747' stroke-width='2'/>
<rect x='350' y='435' width='510' height='55' fill='#E8F4F1' stroke='#203747' stroke-width='2'/>
<text x='605' y='473' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#203747'>Inquiry</text>
<text x='370' y='560' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>id: PK; reference: unique</text>
<text x='370' y='591.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>student_id, course_id, event_id: FK</text>
<text x='370' y='622.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>full_name, email, phone: snapshot</text>
<text x='370' y='653.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>intake, destination, student_location</text>
<text x='370' y='685' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>message, internal_notes</text>
<text x='370' y='716.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>status: New / Contacted /</text>
<text x='370' y='747.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>Converted / Closed</text>
<text x='370' y='778.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>created_at</text>
<rect x='35' y='900' width='465' height='285' fill='white' stroke='#203747' stroke-width='2'/>
<rect x='35' y='900' width='465' height='55' fill='#E8F4F1' stroke='#203747' stroke-width='2'/>
<text x='267.5' y='938' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#203747'>Event</text>
<text x='55' y='1032.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>id: PK</text>
<text x='55' y='1063.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>name, city, venue</text>
<text x='55' y='1095' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>date, time</text>
<text x='55' y='1126.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>capacity: positive integer</text>
<rect x='700' y='930' width='465' height='255' fill='white' stroke='#203747' stroke-width='2'/>
<rect x='700' y='930' width='465' height='55' fill='#E8F4F1' stroke='#203747' stroke-width='2'/>
<text x='932.5' y='968' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='#203747'>User (Django auth)</text>
<text x='720' y='1047.5' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>id: PK; username: unique</text>
<text x='720' y='1078.75' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>password: hashed</text>
<text x='720' y='1110' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>is_staff, is_superuser, is_active</text>
<text x='720' y='1141.25' text-anchor='start' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>groups, user_permissions</text>
<polyline points='267,330 267,480 350,480' fill='none' stroke='#526675' stroke-width='2.5' />
<text x='255' y='371.75' text-anchor='middle' font-family='Arial, sans-serif' font-size='26' font-weight='400' fill='#203747'>1</text>
<text x='312' y='464.375' text-anchor='middle' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>0..*</text>
<polyline points='932,330 932,480 860,480' fill='none' stroke='#526675' stroke-width='2.5' />
<text x='972.5' y='371.75' text-anchor='middle' font-family='Arial, sans-serif' font-size='26' font-weight='400' fill='#203747'>1</text>
<text x='896' y='464.375' text-anchor='middle' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>0..*</text>
<polyline points='267,900 267,780 350,780' fill='none' stroke='#526675' stroke-width='2.5' />
<text x='255' y='872.75' text-anchor='middle' font-family='Arial, sans-serif' font-size='26' font-weight='400' fill='#203747'>1</text>
<text x='312' y='814.375' text-anchor='middle' font-family='Arial, sans-serif' font-size='25' font-weight='400' fill='#203747'>0..*</text>
<text x='725' y='859' text-anchor='middle' font-family='Arial, sans-serif' font-size='22' font-weight='400' fill='#526675'>Each inquiry has exactly one student, course and event.</text>
<text x='725' y='886.5' text-anchor='middle' font-family='Arial, sans-serif' font-size='22' font-weight='400' fill='#526675'>User authorizes staff access; there is no inquiry-owner FK.</text>
</svg>
